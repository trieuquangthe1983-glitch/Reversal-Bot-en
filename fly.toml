# fly.toml app configuration file generated for reversal-bot-license on 2026-05-26T12:38:53+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'reversal-bot-license'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  LICENSE_DB_PATH = '/data/state/licenses.db'
  LICENSE_STATE_DIR = '/data/state'

[[mounts]]
  source = 'license_data'
  destination = '/data'

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    path = '/health'
    protocol = 'http'

[[services]]
  protocol = ''
  internal_port = 0

  [[services.ports]]
    port = 443
    handlers = ['http', 'tls']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
